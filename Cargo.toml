[package]
name = "cc-history-rs"
version = "1.0.4"
edition = "2021"

[[bin]]
name = "cc-history"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
dirs = "6.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
open = "5.3"
once_cell = "1.21"
regex = "1.12"
anyhow = "1.0"
thiserror = "2.0"
pulldown-cmark = "0.13"
notify = "8"
similar = "3.1"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }

[dev-dependencies]
tempfile = "3.27"
