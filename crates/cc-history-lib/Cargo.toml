[package]
name = "cc-history-lib"
version = "0.1.0"
edition = "2021"
description = "Library for reading and managing Claude Code conversation history"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
thiserror = "1.0"
similar = "2.4"
uuid = { version = "1.0", features = ["v4"] }
once_cell = "1.19"

[dev-dependencies]
tempfile = "3.12"
